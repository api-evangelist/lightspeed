arazzo: 1.0.1
info:
  title: Lightspeed Klaviyo Customer Profile Sync
  summary: Upsert Lightspeed POS customers as Klaviyo profiles.
  description: Lightspeed lists Klaviyo on its integrations marketplace. This workflow reads changed X-Series customers and
    upserts each as a Klaviyo profile so in-store shoppers enter email and SMS flows.
  version: 1.0.0
sourceDescriptions:
- name: lightspeedCustomers
  url: https://raw.githubusercontent.com/api-evangelist/lightspeed/refs/heads/main/openapi/lightspeed-customers-api-openapi.yml
  type: openapi
- name: klaviyoProfiles
  url: https://raw.githubusercontent.com/api-evangelist/klaviyo/refs/heads/main/openapi/klaviyo-profiles-api-openapi.yml
  type: openapi
workflows:
- workflowId: lightspeed-klaviyo-customer-profile-sync
  summary: Upsert Lightspeed POS customers as Klaviyo profiles.
  inputs:
    type: object
    properties:
      domain_prefix:
        type: string
      after:
        type: integer
        description: Lightspeed version cursor
  steps:
  - stepId: list-customers
    description: Read changed Lightspeed X-Series customers since the version cursor.
    operationId: $sourceDescriptions.lightspeedCustomers.ListCustomers
    parameters:
    - name: after
      in: query
      value: $inputs.after
    - name: page_size
      in: query
      value: 100
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      customers: $response.body#/data
      email: $response.body#/data/0/email
      first_name: $response.body#/data/0/first_name
      last_name: $response.body#/data/0/last_name
      phone: $response.body#/data/0/mobile
      max_version: $response.body#/version/max
  - stepId: upsert-profile
    description: Create or update the Klaviyo profile keyed by email.
    operationId: $sourceDescriptions.klaviyoProfiles.create_or_update_profile
    parameters:
    - name: revision
      in: header
      value: '2024-10-15'
    requestBody:
      contentType: application/vnd.api+json
      payload:
        data:
          type: profile
          attributes:
            email: $steps.list-customers.outputs.email
            first_name: $steps.list-customers.outputs.first_name
            last_name: $steps.list-customers.outputs.last_name
    successCriteria:
    - condition: $statusCode == 200 || $statusCode == 201
    outputs:
      profile_id: $response.body#/data/id
  outputs:
    profile_id: $steps.upsert-profile.outputs.profile_id
    next_after: $steps.list-customers.outputs.max_version
x-integration:
  partner: klaviyo
  edge_evidence: https://www.lightspeedhq.com/integrations/
  edge_type: claimed
  category: Chat, Customer-engagement, Marketing
  relationship: workflow
  method: generated
  generated: '2026-10-12'
  generator: claude-opus-5-5 (local-v5 enrichment)
  guessed_steps:
  - step: list-customers
    cause: provider-contract
    why: the X-Series spec documents the collection response by example only; the version.max cursor path is read from the
      documented pagination convention, not a schema
  - step: upsert-profile
    cause: partner-contract
    why: revision header value is not fixed by the Klaviyo spec; a dated revision is required at runtime
