description: >-
  Crane is Lightspeed's first-party command line interface for creating, building and deploying
  Lightspeed apps and themes. Its scope is the embedded-app / storefront-theme developer surface, not
  the REST APIs — there is no Lightspeed CLI that calls the Retail, Restaurant or eCom APIs.
scope:
- Scaffolding a new Lightspeed app or theme project
- Building a project for distribution
- Deploying a built project to Lightspeed
