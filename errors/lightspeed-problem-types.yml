  - Conflict. A webhook with the specified details already exists.
  remediation: The resource already exists or is in a state that forbids the transition. Read the current
    state before deciding whether to retry.
- product: K-Series
  status: 500
  title: Internal Server Error
  operations_declaring_it: 7
  spec_descriptions:
  - Internal Server Error - An error occurred on the server.
  - Internal Server Error.
  remediation: Server-side failure. Safe to retry only for operations that carry an idempotency identifier;
    otherwise verify state first.
- product: K-Series
  status: 503
  title: Service Unavailable
  operations_declaring_it: 3
  spec_descriptions:
