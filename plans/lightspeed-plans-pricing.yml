api_access_by_product:
  retail_x_series: Included on all Retail plans; register count drives the rate limit, not the price.
  retail_r_series: Included with a Retail subscription.
  ecom_c_series: Requires an Advanced or Professional subscription tier.
  restaurant_k_series: Add-on on Starter; included on Essential and Premium.
notes:
- All plans require Lightspeed Payments integration.
- Hardware is a separate one-time cost and is not included in subscription pricing.
- Payment processing fees apply in addition to the plan cost.
- No free tier, no trial-only API access and no self-serve developer plan is published.
