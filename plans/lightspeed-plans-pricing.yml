specification: API Commons Plans
specificationVersion: '0.1'
provider: Lightspeed Commerce
providerId: lightspeed
name: Lightspeed Commerce Plans and Pricing
description: >-
  Lightspeed sells software subscriptions per product line, and API access is a property of the tier
  rather than a separately priced product. Retail (X-Series / R-Series) includes API access on every
  tier; Restaurant (K-Series) gates raw API access to Essential and above; eCom C-Series requires an
  Advanced or Professional subscription before the API is usable at all. There is no metered API
  pricing and no developer-only plan.
