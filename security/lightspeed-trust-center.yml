certifications:
- name: PCI DSS
  status: attested
  detail: >-
    Lightspeed states it does not store, process or transmit cardholder data; payment transactions are
    handled by PCI-compliant providers. Attestations of Compliance (AoC) are published per product
    line, including an E-Series PCI AoC and a U-Series PCI AoC.
- name: SOC 2
  status: audited
  detail: Certain Lightspeed products are audited yearly for SOC 2 (security, availability, processing integrity, confidentiality, privacy).
- name: SOC 3
  status: published
  detail: >-
    Public SOC 3 reports are linked for NuORDER by Lightspeed and for Lightspeed Commerce covering
    R-Series, X-Series, C-Series, E-Series, K-Series, L-Series, O-Series, U-Series, Golf and Payments.
- name: GDPR
  status: claimed
  detail: Named among the frameworks Lightspeed and its infrastructure providers maintain.
subprocessor_certifications:
  note: >-
    Lightspeed states its outsourced infrastructure providers maintain SOC 2 Type II, ISO 27001,
    PCI DSS, GDPR, FIPS 140-2 and NIST framework certifications. These are the providers' certifications,
    not Lightspeed's own, and are recorded separately for that reason.
