  platform: Vanta Trust Center
  machine_readable: false
  note: >-
    The trust center itself is a client-rendered Vanta app — the shell served to a crawler is 7KB of
    JavaScript with the title "Lightspeed Trust Center" and no certification names in the HTML. The
    named certifications below therefore come from the statically-rendered
