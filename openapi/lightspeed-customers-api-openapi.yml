                  last_name: null
                  loyalty_balance: 0
                  on_account_limit: null
                  updated_at: '2017-02-13T17:33:25+00:00'
                  version: 2847386277
                  year_to_date: 0
              schema:
                $ref: '#/components/schemas/CustomerCollection'
          description: ''
      summary: List customers
      tags:
      - Customers
    post:
      description: 'Creates a new customer.


        🔒 Requires: `customers:write` scope'
      operationId: CreateCustomer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerBase'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
            new:
              example:
                data:
                  balance: 0
                  created_at: '2017-05-24T01:53:25+00:00'
                  customer_code: Tony-37YP
                  customer_group_id: b1ca8902-f019-11e3-a0f5-b8ca3a64f8f4
                  do_not_email: false
                  email: tony@starkinc.com
                  enable_loyalty: true
                  enable_promotional_sms: false
                  first_name: Tony
                  id: 0af7b240-ab83-11e7-eddc-4023c64c85e5
                  last_name: Stark
                  loyalty_balance: 0
                  name: Tony Stark
                  tax_id: null
                  updated_at: '2017-05-24T01:53:25+00:00'
                  version: 3505346597
                  year_to_date: 0
          description: ''
      summary: Create a new customer
      tags:
      - Customers
  /customers/{customer_id}:
    delete:
      description: 'Deletes the customer with the requested ID.


        🔒 Requires: `customers:write` scope'
      operationId: DeleteCustomerByID
      parameters:
      - description: The customer id
        in: path
        name: customer_id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: ''
      summary: Delete a customer
      tags:
      - Customers
    get:
      description: 'Returns a single customer with a requested ID.


        🔒 Requires: `customers:read` scope'
      operationId: GetCustomerByID
      parameters:
      - description: The customer id
        in: path
        name: customer_id
        required: true
        schema:
          type: string
