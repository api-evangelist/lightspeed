    put:
      description: 'Updates the customer with the requested ID.


        🔒 Requires: `customers:write` scope'
      operationId: UpdateCustomerByID
      parameters:
      - description: The customer id
        in: path
        name: customer_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerBase'
        required: true
      responses:
        '200':
          content:
            application/json:
              example:
                data:
                  balance: 0
                  company_name: Stark Inc.
                  created_at: '2017-05-24T02:02:18+00:00'
                  custom_field_1: Custom value 1
                  custom_field_2: Custom value 2
                  custom_field_3: Custom value 3
                  custom_field_4: Custom value 4
                  customer_code: Tony-AB2W
                  customer_group_id: b1ca8902-f019-11e3-a0f5-b8ca3a64f8f4
                  do_not_email: false
                  email: tony@starkinc.com
                  enable_loyalty: true
                  enable_promotional_sms: false
                  first_name: Tony
