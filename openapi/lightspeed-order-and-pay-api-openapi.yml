                    description: Status of the order operation.
                    type: string
                  type:
                    description: Notification type
                    default: ORDER
                    type: string
                  account:
                    allOf:
                    - description: Related account (if the webhook is configured to provide it)
                    - $ref: '#/components/schemas/apeAccountSnapshot'
                type: object
        required: true
      responses:
        '200':
          description: Your server returns this code if it accepts the callback
  apePayment notification:
    post:
      summary: Payment Notification
      operationId: onlinePaymentNotification
      description: What your webhook implementation will receive when placing a payment
      tags:
      - Order and Pay
      requestBody:
        content:
          application/json:
            examples:
              successfulPayment:
                summary: successful
                value:
                  thirdPartyReference: REF11
                  businessLocationId: 247158188015618
                  status: SUCCESS
                  ikentooAccountId: '2114502594134196'
                  ikentooAccountIdentifier: A123080.14
                  type: PAYMENT
              failurePayment:
                summary: failure
                value:
                  reason: the payment amount is greater than the amount due
                  thirdPartyReference: REF12212
                  businessLocationId: 141948669832802
                  status: FAILURE
                  ikentooAccountIdentifier: A78094.73
                  type: PAYMENT
              failurePaymentAccountError:
                summary: failure with account error
                value:
                  reason: Account not found
                  thirdPartyReference: REF12213
                  businessLocationId: 141948669832802
                  status: FAILURE
                  errors:
                    account:
                      type: ACCOUNT_NOT_FOUND
                  type: PAYMENT
            schema:
              allOf:
              - $ref: '#/components/schemas/apeBaseWebhookInformation'
              - properties:
                  status:
                    enum:
                    - SUCCESS
                    - FAILURE
                    description: Status of the order or payment operation.
                    type: string
                  errors:
                    description: Error details when status is FAILURE.
                    type: object
                    properties:
                      timeout:
                        description: Timeout error details.
                        type: object
                        properties:
                          errorKey:
                            type: string
                            example: errors.payment.pos.task_timeout
                          message:
                            type: string
                            example: Not processed before validity ended
                      account:
                        description: Account error details.
                        type: object
                        properties:
                          type:
                            type: string
                            enum:
                            - ACCOUNT_NOT_FOUND
                            - ACCOUNT_ALREADY_CLOSED
                            - INVALID_TASK
                            - ITEM_NOT_ADDED
                            - ITEM_NOT_FOUND
                            - MISSING_STAFF
                            - NATIVE_PAYMENT_NOT_SUPPORTED
                            - OVERPAID
                            - PAYMENT_ID_NOT_FOUND
                            - PAYMENT_METHOD_NOT_FOUND
                            - STAFF_NOT_FOUND
                            - UPDATE_FAILED
                            - UNKNOWN
                            example: ACCOUNT_NOT_FOUND
                  type:
                    description: Notification type
                    default: PAYMENT
                    type: string
                type: object
        required: true
      responses:
        '200':
          description: Your server returns this code if it accepts the callback
  apeItem availability notification:
    post:
      summary: Item Availability Notification
      operationId: salesRestrictionUpdatedNotification
      description: What your webhook implementation will receive when item sales restrictions are updated
      tags:
      - Order and Pay
      requestBody:
        content:
          application/json:
            examples:
              itemRestricted:
                summary: item restricted
                value:
                  sku: UGG-BB-PUR-06
                  businessLocationId: 247158188015618
                  count: 5
                  countUpdatedAt: '2024-04-04T09:42:00.000+00:00'
                  status: RESTRICTED
                  type: ITEM
              itemNotRestricted:
                summary: item not restricted
                value:
                  sku: UGG-BB-PUR-06
                  businessLocationId: 247158188015618
                  count: null
                  countUpdatedAt: '2024-04-04T09:42:00.000+00:00'
                  status: NOT_RESTRICTED
                  type: ITEM
            schema:
              type: object
              properties:
                sku:
                  type: string
                  description: The SKU of the item with updated availability
                  examples:
                  - UGG-BB-PUR-06
                businessLocationId:
                  $ref: '#/components/schemas/apeBusinessLocationId'
                count:
                  type:
                  - integer
                  - 'null'
                  format: int64
                  description: The available count of the item. null indicates no restriction
                  examples:
                  - 5
                countUpdatedAt:
                  type: string
                  format: date-time
                  description: The timestamp when the count was last updated
                  examples:
                  - '2024-04-04T09:42:00.000+00:00'
                status:
                  type: string
                  enum:
                  - RESTRICTED
                  - NOT_RESTRICTED
                  description: The restriction status of the item
                  examples:
                  - RESTRICTED
                type:
                  type: string
                  description: Notification type
                  default: ITEM
                  examples:
                  - ITEM
              required:
              - sku
              - businessLocationId
              - countUpdatedAt
              - status
              - type
        required: true
      responses:
        '200':
          description: Your server returns this code if it accepts the callback
  apeOnline Ordering API Readiness notification:
    post:
      summary: Online Ordering API Readiness Notification
      operationId: onlineOrderingReadinessUpdatedNotification
      description: What your webhook implementation will receive when online ordering API readiness is updated. See the [Online Order Readiness guide](https://api-portal.lsk.lightspeed.app/guides/integration-guides/online-ordering/online-order-readiness/online-order-readiness-setup) for setup and integration details.
      tags:
      - Order and Pay
      requestBody:
        content:
          application/json:
            examples:
              onlineOrderingAPIReady:
                summary: Online Ordering API ready
                value:
                  businessLocationId: 247158188015618
                  lastUpdatedAt: '2025-10-04T09:40:00.000+00:00'
                  status: READY
                  type: ORDER_API
                  onlineOrderingApiConfiguration:
                    enabled: true
                    orderProfileId: 25769803781
                    staffId: 3
                  posStatus:
                    salesPeriod: OPENED
                    acceptingOnlineOrders: true
                    availableDevices: true
              onlineOrderingAPINotReady:
                summary: Online Ordering API not ready
                value:
                  businessLocationId: 247158188015618
                  lastUpdatedAt: '2025-10-04T09:40:00.000+00:00'
                  status: NOT_READY
                  type: ORDER_API
                  onlineOrderingApiConfiguration:
                    enabled: false
                    orderProfileId: null
                    staffId: null
                  posStatus:
                    salesPeriod: CLOSED
                    acceptingOnlineOrders: false
                    availableDevices: false
            schema:
              type: object
              properties:
                businessLocationId:
                  $ref: '#/components/schemas/apeBusinessLocationId'
                lastUpdatedAt:
                  type: string
                  format: date-time
                  description: The timestamp when the online order readiness was last updated
                  examples:
                  - '2025-10-04T09:40:00.000+00:00'
                status:
                  type: string
                  enum:
                  - READY
                  - NOT_READY
                  description: The readiness status of the online ordering api
                  examples:
                  - READY
                type:
                  type: string
                  description: Notification type
                  default: ORDER_API
                  examples:
                  - ORDER_API
                onlineOrderingApiConfiguration:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      example: true
                    orderProfileId:
                      oneOf:
                      - type: integer
                        format: int64
                        example: 25769803781
                      - type: 'null'
                      description: Order Profile id
                    staffId:
                      oneOf:
                      - type: integer
                        format: int64
                        example: 3
                      - type: 'null'
                      description: Staff id
                  required:
                  - enabled
                  - staffId
                  - orderProfileId
                posStatus:
                  type: object
                  properties:
                    salesPeriod:
                      type: string
                      enum:
                      - OPENED
                      - CLOSED
                      example: OPENED
                    acceptingOnlineOrders:
                      type: boolean
                      example: true
                    availableDevices:
                      type: boolean
                      example: true
                  required:
                  - salesPeriod
                  - acceptingOnlineOrders
                  - availableDevices
              required:
              - businessLocationId
              - lastUpdatedAt
              - status
              - type
              - posStatus
              - onlineOrderingApiConfiguration
        required: true
      responses:
        '200':
          description: Your server returns this code if it accepts the callback
components:
  schemas:
    apeToGoOrderItemLine:
      properties:
        quantity:
          example: 1
          description: Quantity of item to be ordered.
          type: integer
          format: int32
        sku:
          example: UGG-BB-PUR-06
          maxLength: 25
          description: The SKU of the item to be ordered.
          type: string
        customItemName:
          example: My Custom Item Name
          description: The custom name to be used, if overwriting is permitted for this item.
          type: string
        customItemPrice:
          example: 10.0
          description: The custom price to be used, if custom pricing is permitted for this item.
          type: number
        discountAmountOverride:
          description: The custom discount amount applied to this item. Only one of `discountAmountOverride` or `discountPercentOverride` can be set.
          type: number
          example: 5.0
        discountPercentOverride:
          description: The custom percentage discount applied to this item. Only one of `discountAmountOverride` or `discountPercentOverride` can be set.
          type: number
          example: 10.0
        modifiers:
          description: Collection of [modifiers](https://api-docs.lsk.lightspeed.app/operation/operation-apeloadallmodifiers) to be applied to this item.
          type: array
          items:
            $ref: '#/components/schemas/apeItemModifier'
        discountCode:
          example: FIVEPERCENT
          description: The discount code being applied to this item, if applicable.
          type: string
        subItems:
          type: array
          items:
            $ref: '#/components/schemas/apeSubItemOrderLine'
      type: object
      required:
      - quantity
      - sku
    apeAccountProfile:
      properties:
        id:
          format: int64
          type: integer
          description: The unique identifier for the order profile.
          example: 12454575601144
        code:
          type: string
          description: A short code representing the order profile.
          example: takeaway
        name:
          type: string
          example: Takeaway
          description: The system display name for the order profile.
        deliveryMode:
          enum:
          - NONE
          - TAKE_AWAY
          - DELIVERY
          type: string
          example: TAKE_AWAY
          description: Specifies the delivery mode for the order profile.
      type: object
    apeBusinessLocationId:
      description: The unique identifier for the business location.
      type: integer
      format: int64
      example: 45454565682155
    apeMenuItemEntryParentV2:
      properties:
        productName:
          type: string
          description: The name of the item.
          example: Burger
        productPrice:
          type: number
          description: The price of the item.
          example: 10.0
        extraPrice:
          type: number
          description: Additional item price when selected in a combo group.
          example: 1.99
        color:
          type: string
          description: The color of the menu button for this item.
          example: blue
        sku:
          type: string
          description: The SKU of the item.
          example: '25'
        customItemNameEnabled:
          type: boolean
          description: Whether the name of the item can be customized.
          example: false
        pricingStrategy:
          type: string
          description: The pricing type of the item.
          example: PRICE_CANNOT_BE_CUSTOMIZED
          enum:
          - CUSTOMIZED_ITEM_PRICE_WILL_BE_NEGATIVE
          - CUSTOMIZED_ITEM_PRICE_WILL_BE_POSTIVE
          - CUSTOMIZED_ITEM_PRICE_WILL_BE_A_PERCENTAGE_OF_TOTAL
          - PRICE_CANNOT_BE_CUSTOMIZED
        itemRichData:
          $ref: '#/components/schemas/apeItemRichData'
        defaultTaxAmount:
          description: The tax amount as calculated at the default tax rate (a sum for multiple taxes).
          type: number
          example: 1.5
        defaultTaxPercentage:
          description: The default tax percentage for this item (a sum for multiple taxes).
          type: number
          example: 15.0
        taxIncludedInPrice:
          description: Whether or not tax is included in the price of the item.
          type: boolean
          example: false
        conditionalTaxRules:
          description: Warning that actual tax depends on a POS Account condition and may be different from what is provided in this API.
          type: boolean
        taxes:
          description: Detailed tax info
          items:
            $ref: '#/components/schemas/apeMenuItemTax'
          type: array
    apeItemModifier:
      properties:
        modifierId:
          example: '236025632784492'
          description: Modifier ID to be applied to this item.
          type: string
      type: object
    apeMenuDealGroup:
      type: object
      properties:
        description:
          type: string
          description: Description of the combo item grouping.
          example: Side Dishes
        sku:
          type: string
          description: The SKU of the combo item grouping.
          example: '25'
        mustSelectAnItem:
          type: boolean
          description: Whether or not this is a required selection.
          example: true
        multiSelectionPermitted:
          type: boolean
          description: Whether or not multiple items can be selected from this item grouping.
          example: true
        minimumSelection:
          type: integer
          format: int32
          description: The minimum number of items that must be selected from this item grouping. If null then no minimum is set.
          example: 1
        maximumSelection:
          type: integer
          format: int32
          description: The maximum number of items that can be selected from this item grouping. If null then no maximum is set.
          example: 3
        itemRichData:
          $ref: '#/components/schemas/apeItemRichData'
        items:
          description: List of items to select from.
          type: array
          items:
            $ref: '#/components/schemas/apeMenuItemEntry'
      description: Collections of item groups within the combo to select from.
    apeRestrictedItem:
      type: object
      properties:
        sku:
          type: string
          description: The SKU assigned to the item.
          example: SKU1
        count:
          type: integer
          description: The count of available items.
          format: int64
          example: 50
        updatedAt:
          type: string
          format: date-time
          description: The last update of the item count.
          example: '2025-07-08T14:20:00Z'
    apeMenuDealEntry:
      title: menuDeal
      allOf:
      - type: object
        properties:
          '@type':
            type: string
            description: Indicates the item is a Combo.
            example: menuDeal
            enum:
            - menuDeal
          items:
            description: List of items to select from.
            type: array
            items:
              $ref: '#/components/schemas/apeMenuItemEntry'
          menuDealGroups:
            type: array
            description: Array of Items in the Combo
            items:
              $ref: '#/components/schemas/apeMenuDealGroup'
      - $ref: '#/components/schemas/apeMenuItemEntryParent'
    apeTopLevelMenuGroupEntryV2:
      allOf:
      - type: object
        properties:
          '@type':
            type: string
            description: Indicates this is a menu group.
            example: group
            enum:
            - group
          id:
            type: string
            description: The menu group ID.
            example: '141948669133028'
          name:
            type: string
            description: The menu group name.
            example: Mains
          color:
            type: string
            description: The color of the button in the POS.
            example: blue
          menuEntry:
            type: array
            description: Array of menu entry objects.
            items:
              type: object
              oneOf:
              - $ref: '#/components/schemas/apeMenuItemEntryV2'
              - $ref: '#/components/schemas/apeMenuDealEntryV2'
              - $ref: '#/components/schemas/apeMenuGroupEntryV2'
              - $ref: '#/components/schemas/apeMenuProductModifierEntryV2'
              discriminator:
                propertyName: '@type'
                mapping:
                  menuItem: '#/components/schemas/apeMenuItemEntryV2'
                  menuDeal: '#/components/schemas/apeMenuDealEntryV2'
                  group: '#/components/schemas/apeMenuGroupEntryV2'
                  menuProductModifier: '#/components/schemas/apeMenuProductModifierEntryV2'
    apeMenuItemEntry:
      title: menuItem
      allOf:
      - type: object
        properties:
          '@type':
            type: string
            description: Indicates this is an individual item.
            example: menuItem
            enum:
            - menuItem
      - $ref: '#/components/schemas/apeMenuItemEntryParent'
      - type: object
        properties:
          asSubItem:
            type: boolean
            description: Indicates whether or not this product is a sub-item that cannot be sold alone. Note - when the item is nested under a `menuDeal` this will always be false.
          productionInstructionList:
            type: array
            description: Array of production instructions for this product
            items:
              $ref: '#/components/schemas/apeProductionInstruction'
            example:
            - multiSelectionPermitted: false
              productionInstructionGroupName: Meat cooking
              productionIntructionGroupId: 236025632784487
              productionInstructionList:
              - instruction: Bleu
                ikentooModifierId: 236025632784488
              - instruction: Rare
                ikentooModifierId: 236025632784490
              - instruction: Medium Rare
                ikentooModifierId: 236025632784492
              - instruction: Medium
                ikentooModifierId: 236025632784494
              - instruction: Medium well
                ikentooModifierId: 236025632784496
              - instruction: Well done
                ikentooModifierId: 236025632784498
    apeMenuItemEntryV2:
      title: menuItem
      allOf:
      - type: object
        properties:
          '@type':
            type: string
            description: Indicates this is an individual item.
            example: menuItem
            enum:
            - menuItem
      - $ref: '#/components/schemas/apeMenuItemEntryParentV2'
      - type: object
        properties:
          asSubItem:
            type: boolean
            description: Indicates whether or not this product is a sub-item that cannot be sold alone. Note - when the item is nested under a `menuDeal` this will always be false.
          productionInstructionList:
            type: array
            description: Array of production instructions for this product
            items:
              $ref: '#/components/schemas/apeProductionInstruction'
            example:
            - multiSelectionPermitted: false
              productionInstructionGroupName: Meat cooking
              productionIntructionGroupId: 236025632784487
              productionInstructionList:
              - instruction: Bleu
                ikentooModifierId: 236025632784488
              - instruction: Rare
                ikentooModifierId: 236025632784490
              - instruction: Medium Rare
                ikentooModifierId: 236025632784492
              - instruction: Medium
                ikentooModifierId: 236025632784494
              - instruction: Medium well
                ikentooModifierId: 236025632784496
              - instruction: Well done
                ikentooModifierId: 236025632784498
          menuModifierGroups:
            type: array
            description: Array of product modifier groups for this product
            items:
              $ref: '#/components/schemas/apeMenuModifierGroupV2'
    apeTagCode:
      description: The order profile [code](https://api-docs.lsk.lightspeed.app/operation/operation-apeaccountprofiles#operation-apeaccountprofiles-200-body-application-json-accountprofilelist-code).
      type: string
      example: DELIVERY
    apeMenuProductModifierEntryV2:
      title: menuProductModifier
      allOf:
      - type: object
        properties:
          '@type':
            type: string
            description: Indicates this is a product modifier.
            example: menuProductModifier
            enum:
            - menuProductModifier
      - $ref: '#/components/schemas/apeMenuItemEntryParentV2'
      - type: object
        properties:
          productionInstructionList:
            type: array
            description: Array of production instructions for this modifier
            items:
              $ref: '#/components/schemas/apeProductionInstruction'
            example:
            - multiSelectionPermitted: false
              productionInstructionGroupName: Meat cooking
              productionIntructionGroupId: 236025632784487
              productionInstructionList:
              - instruction: Bleu
                ikentooModifierId: 236025632784488
              - instruction: Rare
                ikentooModifierId: 236025632784490
              - instruction: Medium Rare
                ikentooModifierId: 236025632784492
              - instruction: Medium
                ikentooModifierId: 236025632784494
              - instruction: Medium well
                ikentooModifierId: 236025632784496
              - instruction: Well done
                ikentooModifierId: 236025632784498
    apeTopLevelMenuGroupEntry:
      allOf:
      - type: object
        properties:
          '@type':
            type: string
            description: Indicates this is a menu group, which represents a menu screen in the POS.
