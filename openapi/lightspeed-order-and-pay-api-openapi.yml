        number:
          type: integer
          format: int32
          deprecated: true
        tableNumber:
          type: integer
          format: int32
          description: The table number assigned to the check.
          example: 2
        posId:
          type: integer
          format: int64
          description: The unique ID of the POS station that processed the check.
          example: 54321
        deviceId:
          type: integer
          format: int64
          deprecated: true
    apeBaseWebhookInformation:
      type: object
      properties:
        reason:
          description: Reason for failure if applicable.
          type: string
        thirdPartyReference:
          description: Third-party reference you provided when the order or payment was placed.
          type: string
        businessLocationId:
          $ref: '#/components/schemas/apeBusinessLocationId'
        ikentooAccountIdentifier:
          description: The K-series account identifier for a SUCCESS event (V3 format)
          type: string
        iKentooAccountId:
          description: The K-series account identifier for a SUCCESS event (V2 format)
          deprecated: true
          type: integer
          format: int64
    apeOrderApiPosStatusDto:
      type: object
      properties:
        salesPeriod:
          description: Sales period status for the location
          type: string
          enum:
          - OPENED
          - CLOSED
        acceptingOnlineOrders:
          type: boolean
          description: A flag indicating if a POS in the location has the option `Online Orders enabled` in `Control center`
        availableDevices:
          type: boolean
          description: A flag indicating if the location has devices running for accepting and processing online orders
    apeMenuModifierGroupV2:
      type: object
      description: A product modifier group containing product modifiers to select from.
      properties:
        description:
          type: string
          description: Description of the modifier group.
          example: Milk options
        sku:
          type: string
          description: The SKU of the modifier group.
          example: '30'
        mustSelectAnItem:
          type: boolean
          description: Whether or not this is a required selection.
          example: false
        multiSelectionPermitted:
          type: boolean
          description: Whether or not multiple items can be selected from this modifier group.
          example: false
        minimumSelection:
          type: integer
          format: int32
          description: The minimum number of items that must be selected from this modifier group. If null then no minimum is set.
          example: 0
        maximumSelection:
          type: integer
          format: int32
          description: The maximum number of items that can be selected from this modifier group. If null then no maximum is set.
          example: 2
        itemRichData:
          $ref: '#/components/schemas/apeItemRichData'
        productModifiers:
          description: Array of product modifiers within this modifier group.
          type: array
          items:
            $ref: '#/components/schemas/apeMenuProductModifierEntryV2'
    apePaymentBadRequestError:
      description: Standard error payload returned for a rejected payment request.
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          description: The date and time at which the error occurred, in UTC.
          example: 2023-11-07T23:00:20.075+0000
        status:
