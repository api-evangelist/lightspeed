  title: 2026-07 Customer Groups API
  version: 2026-07
servers:
- url: https://{domain_prefix}.retail.lightspeed.app/api/2026-07
  variables:
    domain_prefix:
      default: example
      description: Domain prefix of the store to be operated on
security:
- bearerAuth: []
tags:
- description: Customer Group operations
  name: Customer Groups
paths:
  /customer_groups:
    get:
      description: 'Return a list of Customer Groups


        🔒 Requires: `customers:read` scope'
      operationId: ListCustomerGroups
      parameters:
      - description: The lower limit for the version numbers to be included in the response.
        in: query
        name: after
        schema:
          format: int64
          type: integer
      - description: The upper limit for the version numbers to be included in the response.
        in: query
        name: before
        schema:
          format: int64
          type: integer
      - description: The maximum number of items to be returned in the response.
        in: query
        name: page_size
        schema:
          type: integer
      - description: Indicates whether deleted items should be included in the response.
        in: query
        name: deleted
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              example:
                data:
                - created_at: '2014-06-09T21:04:49+00:00'
                  group_id: '1111111111'
                  id: b1ca8902-f019-11e3-a0f5-b8ca3a64f8f4
                  name: All Customers
                  updated_at: '2014-06-09T21:04:49+00:00'
                  version: 29483
                - created_at: '2015-08-19T21:32:06+00:00'
                  group_id: VIP-Y968
                  id: dc85058a-a683-11e5-e112-46b9bd1f069e
                  name: VIP
                  updated_at: '2015-08-19T21:32:06+00:00'
                  version: 157810
                - created_at: '2016-04-26T21:45:53+00:00'
                  group_id: Students-2SFG
                  id: 06e35f89-3783-11e6-ec7e-0bf840380a64
                  name: Students
                  updated_at: '2016-04-26T21:45:53+00:00'
                  version: 1205737356
                version:
                  max: 1205737356
                  min: 29483
              schema:
                $ref: '#/components/schemas/CustomerGroupCollection'
          description: OK
      summary: List customer groups
      tags:
      - Customer Groups
    post:
      description: 'Create a new customer group


        🔒 Requires: `customers:write` scope'
      operationId: CreateCustomerGroup
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerGroup'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerGroupResponse'
          description: Created
      summary: Create new customer group
      tags:
      - Customer Groups
  /customer_groups/{customer_group_id}:
    get:
      description: 'Return given customer group


        🔒 Requires: `customers:read` scope'
      operationId: GetCustomerGroupById
      parameters:
      - description: The customer group id
        in: path
        name: customer_group_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerGroupResponse'
          description: OK
      summary: Get single customer group
      tags:
      - Customer Groups
    put:
      description: 'Update the given Customer Group


        🔒 Requires: `customers:write` scope'
      operationId: UpdateCustomerGroup
      parameters:
      - description: The customer group id
        in: path
        name: customer_group_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerGroup'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerGroupResponse'
          description: OK
      summary: Update the given customer group
      tags:
      - Customer Groups
  /customer_groups/{customer_group_id}/customers:
    delete:
      description: 'Deletes the given customers from the customer group.


        **Note**: Only the link is deleted, the customers are not.


        🔒 Requires: `customers:write` scope

        '
      operationId: DeleteCustomersFromCustomerGroup
      parameters:
      - description: The customer group id
        in: path
        name: customer_group_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              description: An array of Customer ids to delete from the Customer Group.
              properties:
                customer_ids:
                  items:
                    type: string
                  type: array
              type: object
        required: true
      responses:
        '204':
          content:
            application/json:
              schema:
                type: string
          description: OK
      summary: Delete customers from customer group
      tags:
      - Customer Groups
    get:
      description: 'Returns a list of customers for the given Customer Group


        🔒 Requires: `customers:read` scope'
      operationId: GetCustomerGroupCustomers
      parameters:
      - description: The customer group id
        in: path
        name: customer_group_id
        required: true
        schema:
          type: string
      - description: The lower limit for the version numbers to be included in the response.
        in: query
        name: after
        schema:
          format: int64
          type: integer
      - description: The upper limit for the version numbers to be included in the response.
        in: query
        name: before
        schema:
          format: int64
          type: integer
      - description: The maximum number of items to be returned in the response.
        in: query
        name: page_size
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerCollection'
          description: OK
      summary: Get customers for customer group
      tags:
      - Customer Groups
    post:
      description: 'Associates one or more customers with the given customer group


        🔒 Requires: `customers:write` scope'
      operationId: AddCustomersToCustomerGroup
      parameters:
      - description: The customer group id
        in: path
        name: customer_group_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              description: An array of Customer ids to add to the Customer Group.
              properties:
                customer_ids:
                  items:
                    type: string
                  type: array
              required:
              - customer_ids
              type: object
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                type: boolean
          description: OK
      summary: Add customers to customer group
      tags:
      - Customer Groups
components:
  schemas:
    Version:
      description: An object containing the highest and lowest version numbers for all items of the returned collection.
      properties:
        max:
          description: Highest version number of the payload, or `null` when the result set is empty.
          format: int64
          type:
          - integer
          - 'null'
        min:
          description: Lowest version number of the payload, or `null` when the result set is empty.
          format: int64
          type:
          - integer
          - 'null'
      required:
      - max
      - min
      type: object
    Customer:
      properties:
        balance:
          description: Customer's unpaid balance.
          format: double
          type: number
        company_name:
          description: Company name.
          type:
          - string
          - 'null'
        created_at:
          description: Creation timestamp in UTC.
          type: string
        custom_field_1:
          description: Custom field 1. Can be used to store random data.
          type:
          - string
          - 'null'
        custom_field_2:
          description: Custom field 2.
          type:
          - string
          - 'null'
        custom_field_3:
          description: Custom field 3.
          type:
          - string
          - 'null'
        custom_field_4:
          description: Custom field 4.
          type:
          - string
          - 'null'
        customer_code:
          description: Customer code used for claiming loyalty.
          type: string
        customer_group_id:
          description: Customer group ID.
          type: string
        date_of_birth:
          description: Birthday.
          type:
          - string
          - 'null'
        deleted_at:
          description: Deletion timestamp in UTC.
          type:
          - string
          - 'null'
        do_not_email:
          default: false
          description: Indicates whether the customer opted out of email communications.
          type: boolean
        email:
          description: Customer's email address.
          type:
          - string
          - 'null'
        enable_loyalty:
          type: boolean
        enable_promotional_sms:
          default: false
          description: Indicates whether the customer opted in to SMS communications.
          type: boolean
        fax:
          description: Fax no.
          type:
          - string
          - 'null'
        first_name:
          description: Customer's first name.
          type:
          - string
          - 'null'
        gender:
          description: Customer's gender. Can be `M`, `F` or null.
          type:
          - string
          - 'null'
        id:
