openapi: 3.2.0
info:
  contact:
    email: x-series.api@lightspeedhq.com
    name: Lightspeed Developer Relations
    url: https://developers.retail.lightspeed.app
  description: Lightspeed Retail (X-Series) API.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://developers.lightspeedhq.com/terms
  title: 2026-07 Quotes API
  version: 2026-07
servers:
- url: https://{domain_prefix}.retail.lightspeed.app/api/2026-07
  variables:
    domain_prefix:
      default: example
      description: Domain prefix of the store to be operated on
security:
- bearerAuth: []
tags:
- description: Quotes operations
  name: Quotes
paths:
  /quotes:
    get:
      description: 'Returns a paginated list of quotes.


        🔒 Requires: `sales:read` scope'
      operationId: get-quotes
      parameters:
      - description: The lower limit for the quote id to be included in the response. For proper pagination, it needs to be the quote id of the last item in the response from your previous request.
        in: query
        name: after
        schema:
          format: int64
          type: integer
      - description: The maximum number of items to be returned in the response.
        in: query
        name: limit
        schema:
          default: 100
          format: int64
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotesCollection'
          description: OK
      summary: List Quotes
      tags:
      - Quotes
  /quotes/{quote_id}:
    parameters:
    - description: ID of the quote to get
      in: path
      name: quote_id
      required: true
      schema:
        type: string
    get:
      description: 'Returns a single quote with a given ID.


        🔒 Requires: `sales:read` scope'
      operationId: get-quote-quote_id
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
          description: OK
      summary: Get Quote
      tags:
      - Quotes
