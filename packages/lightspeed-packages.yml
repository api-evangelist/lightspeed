method: searched
source: >-
  registry.npmjs.org, rubygems.org, pypi.org, packagist.org searches plus the Lightspeed developer
  portals. Versions and dates read from each registry's metadata endpoint on 2026-08-27.
note: >-
  Lightspeed publishes no first-party REST client library for its four flagship APIs (Retail X-Series,
  Retail R-Series, eCom C-Series, Restaurant K-Series). The @lightspeed npm scope is real and
  first-party, but it carries payments, storefront-headless, CLI and design-system packages rather
  than API clients. The most-used Retail SDKs on npm and Packagist are community-maintained and one of
  them says "unofficial" in its own description. This is the single largest developer-experience gap
  in the profile.
packages:
