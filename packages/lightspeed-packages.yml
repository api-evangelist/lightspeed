  language: JavaScript
  official: true
  version: 1.7.3
  published: '2026-08-25'
  covers: Lightspeed Payments (online payments drop-in / components)
  note: >-
    First-party, on the company-controlled @lightspeed npm scope, and the most actively maintained
    Lightspeed package in any registry. Wraps the payments surface, not the Retail/Restaurant REST APIs.
